# Generic fallback profile (VENUE_UNKNOWN). Every rule is assumed; listed in open_issues.md.
venue: {name: "generic research article (README states the venue is not yet final)", type: workshop, guideline_urls: []}
structure:
  section_template: [Title, Abstract, Introduction, Related Work, Methods, Experimental Setup, Results, Discussion, Limitations, Conclusion, References]
  results_discussion: separate
  related_work_position: after_intro
  limitations_section_required: true
  assumed: true
limits: {pages_main: null, words_main: 4500, abstract_words: 250, supplement_allowed: true, assumed: true}
style:
  citation_style: numeric
  voice_preference: "active voice; 'we' for author actions"
  spelling: US
  abstract_format: unstructured
  abstract_citations_allowed: false
  assumed: true
required_statements:
  data_availability: true
  code_availability: true
  ai_use_disclosure: "Methods or Acknowledgments; describe the tool and what it was used for"
  assumed: true
checklists: []
reporting_guideline: null
