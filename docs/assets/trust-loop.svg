<line x1="224.61411531843294" y1="224.99328341096654" x2="202.49996193384425" y2="160.00121213252206" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="338.51530858159896" y1="125.80874313376486" x2="350.93616032993214" y2="93.01988050181848" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
