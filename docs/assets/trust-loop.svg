<text x="440.0" y="90.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Observe</text>
<rect x="546.6761902332486" y="111.32738110421965" width="160" height="44" rx="9" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
<text x="626.6761902332486" y="138.32738110421965" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Claim</text>
<rect x="624.0" y="228.0" width="160" height="44" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="704.0" y="255.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Trace</text>
<rect x="546.6761902332486" y="344.6726188957804" width="160" height="44" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="626.6761902332486" y="371.6726188957804" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Validate</text>
<rect x="360.0" y="393.0" width="160" height="44" rx="9" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
<text x="440.0" y="420.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Review</text>
<rect x="173.32380976675145" y="344.6726188957804" width="160" height="44" rx="9" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.6"/>
<text x="253.32380976675145" y="371.6726188957804" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Fix / Decline / Ask</text>
