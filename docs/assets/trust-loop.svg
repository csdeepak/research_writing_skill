<svg xmlns="http://www.w3.org/2000/svg" width="880" height="488" viewBox="0 0 880 488" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">The trust loop</title>
<desc id="d">A cycle: observe, claim, trace, validate, review, then fix, decline or ask the author, record a test case, and improve, which leads back to observe.</desc>
