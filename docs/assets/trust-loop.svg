<text x="440" y="246" text-anchor="middle" font-size="13" fill="#57606a" font-weight="400">unsupported claims are</text>
<text x="440" y="264" text-anchor="middle" font-size="13" fill="#57606a" font-weight="400">blocked or flagged, never silently kept</text>
<rect x="70" y="452" width="16" height="16" rx="4" fill="#e7f1ff" stroke="#0969da" stroke-width="1.5"/>
<text x="94" y="465" font-size="13" fill="#1f2328">deterministic</text>
<rect x="260" y="452" width="16" height="16" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="284" y="465" font-size="13" fill="#1f2328">model (any)</text>
<rect x="450" y="452" width="16" height="16" rx="4" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.5"/>
<text x="474" y="465" font-size="13" fill="#1f2328">human decision</text>
<rect x="640" y="452" width="16" height="16" rx="4" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
<text x="664" y="465" font-size="13" fill="#1f2328">observation</text>
