<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Model-agnostic design</title>
<desc id="d">The RCE core of rules, evidence contracts and gates sits in the centre; Claude, OpenAI-compatible APIs, Gemini, local models, any command-line tool and manual copy-paste connect to it as interchangeable adapters.</desc>
