<text x="440.0" y="214.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">RCE core</text>
<text x="440.0" y="232.0" text-anchor="middle" font-size="12" fill="#ffffff">rules, evidence contracts, gates</text>
