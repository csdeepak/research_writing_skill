<text x="725.7883832488648" y="148.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">OpenAI-compatible</text>
<line x1="542.2" y1="245.0" x2="665.2" y2="282.0" stroke="#bc4c00" stroke-width="1.6" stroke-dasharray="5 4"/>
