<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">RCE architecture</title>
<desc id="d">Research repository flows into the evidence layer, claim layer and writing layer; drafts pass through the validation layer and a blind review to the final paper; real failures become regression cases approved by a human.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="339" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="440" y="36" text-anchor="middle" font-size="18" fill="#1f2328" font-weight="700">Research Communication Engine: layers</text>
<rect x="30" y="70" width="190" height="64" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="125.0" y="98.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Research repository</text>
<text x="125.0" y="116.0" text-anchor="middle" font-size="12" fill="#57606a">results, logs, notes</text>
<line x1="220" y1="102" x2="238" y2="102" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="240" y="70" width="190" height="64" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="335.0" y="98.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Evidence layer</text>
<text x="335.0" y="116.0" text-anchor="middle" font-size="12" fill="#57606a">evidence map + hashes</text>
<line x1="430" y1="102" x2="448" y2="102" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="450" y="70" width="190" height="64" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="545.0" y="98.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Claim layer</text>
<text x="545.0" y="116.0" text-anchor="middle" font-size="12" fill="#57606a">claim map + licenses</text>
<line x1="640" y1="102" x2="658" y2="102" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="660" y="70" width="190" height="64" rx="9" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
<text x="755.0" y="98.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Writing layer</text>
<text x="755.0" y="116.0" text-anchor="middle" font-size="12" fill="#57606a">any model follows SKILL.md</text>
<line x1="755" y1="134" x2="755" y2="176" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="180" width="190" height="64" rx="9" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.6"/>
<text x="125.0" y="208.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Regression cases</text>
<text x="125.0" y="226.0" text-anchor="middle" font-size="12" fill="#57606a">cases/ + tests</text>
<line x1="238" y1="212" x2="222" y2="212" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="240" y="180" width="190" height="64" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="335.0" y="208.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Final paper</text>
<text x="335.0" y="226.0" text-anchor="middle" font-size="12" fill="#57606a">claims traced to evidence</text>
<line x1="448" y1="212" x2="432" y2="212" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="450" y="180" width="190" height="64" rx="9" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
<text x="545.0" y="208.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Blind review</text>
<text x="545.0" y="226.0" text-anchor="middle" font-size="12" fill="#57606a">packet only; calibrated</text>
<line x1="658" y1="212" x2="642" y2="212" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="660" y="180" width="190" height="64" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="755.0" y="208.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Validation layer</text>
<text x="755.0" y="226.0" text-anchor="middle" font-size="12" fill="#57606a">numbers, figures, gates</text>
<line x1="125" y1="244" x2="125" y2="270" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 5"/>
<text x="135" y="284" text-anchor="start" font-size="12" fill="#57606a" font-weight="400">failures become permanent tests (human-approved)</text>
<rect x="40" y="305" width="16" height="16" rx="4" fill="#e7f1ff" stroke="#0969da" stroke-width="1.5"/>
<text x="64" y="318" font-size="13" fill="#1f2328">deterministic tools</text>
<rect x="230" y="305" width="16" height="16" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="254" y="318" font-size="13" fill="#1f2328">any model (adapter)</text>
<rect x="420" y="305" width="16" height="16" rx="4" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.5"/>
<text x="444" y="318" font-size="13" fill="#1f2328">human decision</text>
<rect x="610" y="305" width="16" height="16" rx="4" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
<text x="634" y="318" font-size="13" fill="#1f2328">inputs / outputs</text>
</svg>
