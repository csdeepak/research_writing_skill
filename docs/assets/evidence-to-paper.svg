<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Evidence to paper</title>
<desc id="d">Data, results, logs, notes, READMEs and drafts feed an evidence map, then a claim map, a story and the paper; a traceability path leads from every paper claim back to its claim id, evidence id and source file.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="369" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="440" y="36" text-anchor="middle" font-size="18" fill="#1f2328" font-weight="700">From raw evidence to a traceable paper</text>
<rect x="30" y="62" width="120" height="34" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="90.0" y="84.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">DATA</text>
<line x1="150" y1="79" x2="216" y2="187" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="106" width="120" height="34" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="90.0" y="128.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">RESULTS</text>
<line x1="150" y1="123" x2="216" y2="187" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="150" width="120" height="34" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="90.0" y="172.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">LOGS</text>
<line x1="150" y1="167" x2="216" y2="187" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="194" width="120" height="34" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="90.0" y="216.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">NOTES</text>
<line x1="150" y1="211" x2="216" y2="187" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="238" width="120" height="34" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="90.0" y="260.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">README</text>
<line x1="150" y1="255" x2="216" y2="187" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="282" width="120" height="34" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="90.0" y="304.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">DRAFTS</text>
<line x1="150" y1="299" x2="216" y2="187" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="220" y="158" width="145" height="60" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="292.5" y="184.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Evidence map</text>
<text x="292.5" y="202.0" text-anchor="middle" font-size="12" fill="#57606a">E###: locator, value</text>
<line x1="365" y1="188" x2="383" y2="188" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="385" y="158" width="145" height="60" rx="9" fill="#e7f1ff" stroke="#0969da" stroke-width="1.6"/>
<text x="457.5" y="184.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Claim map</text>
<text x="457.5" y="202.0" text-anchor="middle" font-size="12" fill="#57606a">C###: evidence, license</text>
<line x1="530" y1="188" x2="548" y2="188" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="550" y="158" width="145" height="60" rx="9" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
<text x="622.5" y="184.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Story</text>
<text x="622.5" y="202.0" text-anchor="middle" font-size="12" fill="#57606a">spine + outline</text>
<line x1="695" y1="188" x2="713" y2="188" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="715" y="158" width="145" height="60" rx="9" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.6"/>
<text x="787.5" y="184.0" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">Paper</text>
<text x="787.5" y="202.0" text-anchor="middle" font-size="12" fill="#57606a">every sentence tagged</text>
<path d="M 792 218 C 792 318, 330 318, 158 300" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="470" y="346" text-anchor="middle" font-size="13" fill="#1a7f37" font-weight="600">traceability: paper claim → C### → E### → file and line</text>
</svg>
